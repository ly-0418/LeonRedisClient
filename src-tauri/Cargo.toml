[package]
name = "leon-redis-client"
version = "1.0.0"
description = "LeonRedis - 本地 Redis 可视化客户端"
authors = ["Leon"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "leon_redis_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
